<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Задачи</title>
</head>
<body>
    <h1>Задачи</h1>
    <ul class="list-task">
    {{range .Tasks}}
        <li>
            <a href="/tasks/{{.TaskID}}" class="name-task">{{.Title}}</a>
            <span>-</span>
            <span class="difficulty-text {{.Difficulty}}">{{.Difficulty}}</span>
        </li>
    {{end}}
    </ul>
</body>
</html>
