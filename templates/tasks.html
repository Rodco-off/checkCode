<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Задачи</title>
</head>
<body>
    <h1>Задачи</h1>
    <div class="filters">
        <a href="/" class="filter-btn {{if eq .CurrentFilter ""}}active{{end}}">Все</a>
        <a href="/?difficulty=easy" class="filter-btn {{if eq .CurrentFilter " easy"}}active{{end}}">Easy</a>
        <a href="/?difficulty=medium" class="filter-btn {{if eq .CurrentFilter "medium"}}active{{end}}">Medium</a>
        <a href="/?difficulty=hard" class="filter-btn {{if eq .CurrentFilter " hard"}}active{{end}}">Hard</a>
    </div>
    <ul class="list-task">
    {{range .Tasks}}
        <li>
            <a href="/tasks/{{.TaskID}}" class="name-task">{{.Title}}</a>
            <span>-</span>
            <span class="difficulty-text {{.Difficulty}}">{{.Difficulty}}</span>
        </li>
    {{end}}
    </ul>
</body>
</html>
